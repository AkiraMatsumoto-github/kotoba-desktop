name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # GPU は無いので lint・型チェック・単体テストだけを回す
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest
